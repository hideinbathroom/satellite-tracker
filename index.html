<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Real-time GPS Satellite Tracker — 3D orbital visualization" />
  <title>GPS Satellite Tracker</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       3D SCENE CONTAINER
  ════════════════════════════════════════════ -->
  <div id="scene-container"></div>

  <!-- ═══════════════════════════════════════════
       LOADING OVERLAY
  ════════════════════════════════════════════ -->
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="loading-ring">
        <svg viewBox="0 0 80 80" width="80" height="80">
          <circle class="loading-ring-track" cx="40" cy="40" r="34" />
          <circle class="loading-ring-fill" cx="40" cy="40" r="34" />
        </svg>
      </div>
      <h2 class="loading-title">GPS Satellite Tracker</h2>
      <p id="loading-status" class="loading-status">Initializing orbital data…</p>
      <div class="loading-bar">
        <div id="loading-progress" class="loading-bar-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SETTINGS PANEL (top-left)
  ════════════════════════════════════════════ -->
  <div id="settings-panel" class="panel settings-panel" aria-label="Settings">
    <button id="settings-toggle" class="icon-btn settings-toggle" aria-label="Toggle settings" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div id="settings-body" class="settings-body" hidden>
      <h3 class="panel-heading">Display Settings</h3>
      <label class="toggle-row">
        <span class="toggle-label">Orbit Paths</span>
        <input type="checkbox" id="setting-orbits" class="toggle-input" checked />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
      <label class="toggle-row">
        <span class="toggle-label">Satellite Labels</span>
        <input type="checkbox" id="setting-labels" class="toggle-input" checked />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
      <label class="toggle-row">
        <span class="toggle-label">Atmosphere</span>
        <input type="checkbox" id="setting-atmosphere" class="toggle-input" checked />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
      <div class="settings-divider"></div>
      <h3 class="panel-heading">Satellite Groups</h3>
      <label class="toggle-row">
        <span class="toggle-label">GPS (USA)</span>
        <input type="checkbox" id="group-gps" class="toggle-input" checked />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
      <label class="toggle-row">
        <span class="toggle-label">GLONASS (Russia)</span>
        <input type="checkbox" id="group-glonass" class="toggle-input" />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
      <label class="toggle-row">
        <span class="toggle-label">Galileo (EU)</span>
        <input type="checkbox" id="group-galileo" class="toggle-input" />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SATELLITE LIST SIDEBAR (left)
  ════════════════════════════════════════════ -->
  <aside id="satellite-sidebar" class="panel satellite-sidebar" aria-label="Satellite list">
    <div class="sidebar-header">
      <button id="sidebar-toggle" class="icon-btn sidebar-collapse-btn" aria-label="Collapse satellite list" aria-expanded="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h2 class="sidebar-title">Satellites</h2>
      <span id="sat-count-badge" class="count-badge">0</span>
    </div>

    <div id="sidebar-body" class="sidebar-body">
      <div class="search-wrapper">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="satellite-search" type="search" class="search-input" placeholder="Search satellites…" autocomplete="off" />
      </div>

      <div class="filter-chips">
        <button class="chip chip-active" data-filter="all">All</button>
        <button class="chip" data-filter="healthy">
          <span class="chip-dot chip-dot--green"></span>Healthy
        </button>
        <button class="chip" data-filter="degraded">
          <span class="chip-dot chip-dot--amber"></span>Degraded
        </button>
        <button class="chip" data-filter="offline">
          <span class="chip-dot chip-dot--magenta"></span>Offline
        </button>
      </div>

      <ul id="satellite-list" class="satellite-list" role="listbox" aria-label="GPS satellites">
        <!-- Populated dynamically -->
      </ul>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════
       SATELLITE INFO PANEL (top-right)
  ════════════════════════════════════════════ -->
  <section id="satellite-info" class="panel satellite-info" hidden aria-label="Satellite details">
    <div class="info-header">
      <div class="info-title-row">
        <span id="info-status-dot" class="status-dot status-dot--healthy"></span>
        <h2 id="info-name" class="info-name">—</h2>
      </div>
      <button id="info-close" class="icon-btn info-close-btn" aria-label="Close satellite info">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="info-grid">
      <div class="info-cell">
        <span class="info-label">NORAD ID</span>
        <span id="info-norad" class="info-value mono">—</span>
      </div>
      <div class="info-cell">
        <span class="info-label">Altitude</span>
        <span id="info-altitude" class="info-value mono">— <small>km</small></span>
      </div>
      <div class="info-cell">
        <span class="info-label">Velocity</span>
        <span id="info-velocity" class="info-value mono">— <small>km/s</small></span>
      </div>
      <div class="info-cell">
        <span class="info-label">Orbital Period</span>
        <span id="info-period" class="info-value mono">— <small>min</small></span>
      </div>
      <div class="info-cell">
        <span class="info-label">Latitude</span>
        <span id="info-lat" class="info-value mono">—°</span>
      </div>
      <div class="info-cell">
        <span class="info-label">Longitude</span>
        <span id="info-lng" class="info-value mono">—°</span>
      </div>
      <div class="info-cell info-cell--wide">
        <span class="info-label">Health Status</span>
        <span id="info-health" class="info-value health-badge health-badge--healthy">Healthy</span>
      </div>
      <div class="info-cell info-cell--wide">
        <span class="info-label">Constellation</span>
        <span id="info-constellation" class="info-value">—</span>
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════
       STATS BAR (top-center)
  ════════════════════════════════════════════ -->
  <div id="stats-bar" class="stats-bar" aria-label="Mission statistics">
    <div class="stat-item">
      <span class="stat-label">Tracking</span>
      <span id="stat-count" class="stat-value mono">0</span>
      <span class="stat-unit">satellites</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-label">UTC</span>
      <span id="stat-time" class="stat-value mono">--:--:--</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       TIME CONTROL BAR (bottom-center)
  ════════════════════════════════════════════ -->
  <div id="time-controls" class="panel time-controls" aria-label="Time controls">
    <button id="time-play-pause" class="icon-btn play-btn" aria-label="Play/Pause simulation">
      <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
      <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" hidden>
        <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
      </svg>
    </button>

    <div class="time-speed-group">
      <label for="time-speed" class="time-speed-label">Speed</label>
      <input id="time-speed" type="range" class="speed-slider" min="0" max="3" step="1" value="0" list="speed-ticks" />
      <span id="time-speed-display" class="speed-display mono">1×</span>
      <datalist id="speed-ticks">
        <option value="0" label="1×"></option>
        <option value="1" label="10×"></option>
        <option value="2" label="100×"></option>
        <option value="3" label="1000×"></option>
      </datalist>
    </div>

    <div class="time-divider"></div>

    <div class="time-datetime-group">
      <svg class="time-clock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span id="time-date-display" class="time-date mono">2024-01-01</span>
      <span id="time-time-display" class="time-time mono">00:00:00 UTC</span>
    </div>

    <button id="time-reset" class="icon-btn reset-btn" aria-label="Reset to current time" title="Reset to now">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
  </div>

  <!-- Entry point -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
